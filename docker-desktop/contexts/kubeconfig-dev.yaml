---
# Docker Desktop Development Context
# Doc-Type: Configuration · Version 1.0 · Updated 2025-11-10

apiVersion: v1
kind: Config
current-context: docker-desktop-dev
preferences: {}

clusters:
  - cluster:
      server: https://kubernetes.docker.internal:6443
      insecure-skip-tls-verify: true
    name: docker-desktop

contexts:
  - context:
      cluster: docker-desktop
      user: docker-desktop
      namespace: dev
    name: docker-desktop-dev

  - context:
      cluster: docker-desktop
      user: docker-desktop
      namespace: testing
    name: docker-desktop-testing

  - context:
      cluster: docker-desktop
      user: docker-desktop
      namespace: default
    name: docker-desktop-default

users:
  - name: docker-desktop
    user:
      client-certificate-data: ${DOCKER_DESKTOP_CLIENT_CERT}
      client-key-data: ${DOCKER_DESKTOP_CLIENT_KEY}
