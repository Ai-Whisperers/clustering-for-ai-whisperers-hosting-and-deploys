---
# GitLab Secrets Template
# Doc-Type: Configuration Template · Version 1.0 · Updated 2025-11-10
# IMPORTANT: Replace placeholder values before deployment

apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgres-secret
  namespace: gitlab
type: Opaque
stringData:
  password: REPLACE_WITH_SECURE_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-secret
  namespace: gitlab
type: Opaque
stringData:
  password: REPLACE_WITH_SECURE_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-gitaly-secret
  namespace: gitlab
type: Opaque
stringData:
  token: REPLACE_WITH_SECURE_TOKEN

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-object-storage
  namespace: gitlab
type: Opaque
stringData:
  connection: |
    provider: AWS
    region: us-east-1
    aws_access_key_id: REPLACE_WITH_ACCESS_KEY
    aws_secret_access_key: REPLACE_WITH_SECRET_KEY
    aws_signature_version: 4

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-storage
  namespace: gitlab
type: Opaque
stringData:
  config: |
    s3:
      bucket: gitlab-registry
      region: us-east-1
      encrypt: true
      secure: true
  s3.yaml: |
    accesskey: REPLACE_WITH_ACCESS_KEY
    secretkey: REPLACE_WITH_SECRET_KEY

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-runner-cache
  namespace: gitlab-runners
type: Opaque
stringData:
  accesskey: REPLACE_WITH_ACCESS_KEY
  secretkey: REPLACE_WITH_SECRET_KEY

---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitlab-sso
  namespace: argocd
type: Opaque
stringData:
  client_id: REPLACE_WITH_GITLAB_APPLICATION_ID
  client_secret: REPLACE_WITH_GITLAB_APPLICATION_SECRET

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-repo-creds
  namespace: argocd
type: Opaque
stringData:
  username: gitlab-argocd
  password: REPLACE_WITH_GITLAB_TOKEN
